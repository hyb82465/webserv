server {
    listen 127.0.0.1:8080;

    root ./www;
    index index.html;

    client_max_body_size 1000000;

    error_page 404 ./errors/404.html;
    error_page 403 ./errors/403.html;
    error_page 500 ./errors/500.html;
    error_page 413 ./errors/413.html;

    location /images {
        root ./assets;
        index gallery.html;
        methods GET;

        autoindex on;
    }

    location /upload {
        root ./uploads;
        methods POST;

        upload_store ./uploads;
    }


    location /delete {
        root ./www;
        methods GET DELETE;
    }

    location /old {
        return 301 /new;
    }

    location /cgi-bin {
        root ./www;

        methods GET POST;

        cgi .py /usr/bin/python3;
    }
}


server {
    listen 127.0.0.1:8081;

    root ./www2;
    index index.html;

    client_max_body_size 500000;

    error_page 404 ./errors/404.html;
    error_page 403 ./errors/403.html;
    error_page 500 ./errors/500.html;

    location /images {
        root ./assets2;
        index gallery.html;

        methods GET;

        autoindex on;
    }

    location /upload {
        methods POST;

        upload_store ./uploads2;
    }

    location /cgi-bin {
        root ./www2;

        methods GET POST;

        cgi .py /usr/bin/python3;
    }
}