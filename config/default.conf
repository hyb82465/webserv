server {
    listen 127.0.0.1:8080;
    listen 127.0.0.1:8081;

    root ./www;

    index index.html;

    client_max_body_size 1000000;

    error_page 404 .www/errors/404.html;

    error_page 500 .www/errors/500.html;

    location /images {
        root ./assets;
        index gallery.html;
        methods GET;

        autoindex on;
    }

    location /upload {
        methods POST;

        upload_store ./uploads;
    }

    location /old {
    return 301 /new;
    }
    location /cgi-bin {
        root ./www;

        methods GET POST;

        cgi .py /usr/bin/python3;
    }
}
