server {
    listen 127.0.0.1:8080;

    root ./www;
    index index.html;

    client_max_body_size 1000000;

    error_page 404 ./www/errors/404.html;
    error_page 403 ./www/errors/403.html;
    error_page 500 ./www/errors/500.html;
    error_page 413 ./www/errors/413.html;

    location / {
        methods GET;
    }
    location /directory/ {
    root ./YoupiBanane;
    index youpi.bad_extension;
    methods  POST;
    cgi .bla /home/zhma/Documents/webserv/cgi_tester;
}

    location /images {
        root ./assets;
        index gallery.html;
        methods GET;

        autoindex on;
    }

    location /upload {
        methods POST;

        upload_store ./uploads;
    }

    location /uploads {
        root ./uploads;

        methods GET;
    }

    location /delete {
        root ./www/delete;
        methods GET DELETE;
    }

    location /old {
        return 301 /new;
    }

    location /cgi-bin {
        root ./cgi-bin;

        methods GET POST;

        cgi .py /usr/bin/python3;
    }
}


