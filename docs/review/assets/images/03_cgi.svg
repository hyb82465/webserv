<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 650" role="img" aria-label="03  CGI 管道：父进程与子进程"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#526b80"/></marker></defs><rect width="100%" height="100%" fill="#f7fafc"/><text x="24" y="35" font-family="sans-serif" font-size="23" fill="#153749">03  CGI 管道：父进程与子进程</text><polyline points="200,155 200,225" fill="none" stroke="#526b80" stroke-width="2" marker-end="url(#arrow)"/><text x="215" y="192" font-family="sans-serif" font-size="13" fill="#516271">等待 POLLOUT</text><polyline points="365,260 565,260" fill="none" stroke="#526b80" stroke-width="2" marker-end="url(#arrow)"/><text x="385" y="247" font-family="sans-serif" font-size="13" fill="#516271">输入正文 / 写完关闭</text><polyline points="730,300 730,380" fill="none" stroke="#526b80" stroke-width="2" marker-end="url(#arrow)"/><text x="744" y="341" font-family="sans-serif" font-size="13" fill="#516271">程序处理</text><polyline points="565,417 365,417" fill="none" stroke="#526b80" stroke-width="2" marker-end="url(#arrow)"/><text x="416" y="402" font-family="sans-serif" font-size="13" fill="#516271">CGI 响应字节</text><polyline points="200,455 200,535" fill="none" stroke="#526b80" stroke-width="2" marker-end="url(#arrow)"/><text x="216" y="500" font-family="sans-serif" font-size="13" fill="#516271">等待 EOF 与退出</text><rect x="35" y="85" width="330" height="70" rx="10" fill="white" stroke="#94b1bd"/><text x="200.0" y="110" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#173f53">父进程：webserv</text><text x="200.0" y="131" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#173f53">CgiHandler + Server.poll</text><rect x="565" y="85" width="330" height="70" rx="10" fill="white" stroke="#94b1bd"/><text x="730.0" y="110" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#173f53">子进程：解释器 / CGI 程序</text><text x="730.0" y="131" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#173f53">fork 后经 execve 替换</text><rect x="35" y="225" width="330" height="75" rx="10" fill="white" stroke="#94b1bd"/><text x="200.0" y="250" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#173f53">_requestBody → write</text><text x="200.0" y="271" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#173f53">inputPipe[1]：父进程非阻塞写端</text><rect x="565" y="225" width="330" height="75" rx="10" fill="white" stroke="#94b1bd"/><text x="730.0" y="250" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#173f53">stdin (fd 0) → CGI 处理</text><text x="730.0" y="271" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#173f53">inputPipe[0] 经 dup2</text><rect x="565" y="380" width="330" height="75" rx="10" fill="white" stroke="#94b1bd"/><text x="730.0" y="405" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#173f53">CGI 输出 → stdout (fd 1)</text><text x="730.0" y="426" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#173f53">outputPipe[1] 经 dup2</text><rect x="35" y="380" width="330" height="75" rx="10" fill="white" stroke="#94b1bd"/><text x="200.0" y="405" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#173f53">read → _output</text><text x="200.0" y="426" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#173f53">outputPipe[0]：父进程非阻塞读端</text><rect x="35" y="535" width="330" height="75" rx="10" fill="white" stroke="#94b1bd"/><text x="200.0" y="560" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#173f53">stdout EOF + waitpid 确认退出</text><text x="200.0" y="581" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#173f53">finishCgi → HTTP → 客户端</text><rect x="565" y="535" width="330" height="75" rx="10" fill="white" stroke="#94b1bd"/><text x="730.0" y="560" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#173f53">stderr (fd 2)</text><text x="730.0" y="581" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#173f53">继承终端或父进程的错误日志目标</text></svg>