server {
    listen 8080;

    root ./www;

    index index.html;

    client_max_body_size 1000000;

    error_page 404 ./errors/404.html;

    error_page 500 ./errors/500.html;

    location /images {
        root ./assets;

        methods GET;

        autoindex on;
    }

    location /upload {
        methods POST;

        upload_store ./uploads;
    }
}
