<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 875" role="img" aria-label="02  一次请求：阶段与分支"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#526b80"/></marker></defs><rect width="100%" height="100%" fill="#f7fafc"/><text x="24" y="35" font-family="sans-serif" font-size="23" fill="#153749">02  一次请求：阶段与分支</text><polyline points="450,127 450,170" fill="none" stroke="#526b80" stroke-width="2" marker-end="url(#arrow)"/><text x="464" y="151" font-family="sans-serif" font-size="13" fill="#516271">解析</text><polyline points="370,235 145,285" fill="none" stroke="#526b80" stroke-width="2" marker-end="url(#arrow)"/><text x="224" y="252" font-family="sans-serif" font-size="13" fill="#516271">不足</text><polyline points="450,235 450,285" fill="none" stroke="#526b80" stroke-width="2" marker-end="url(#arrow)"/><text x="460" y="260" font-family="sans-serif" font-size="13" fill="#516271">完成</text><polyline points="540,235 755,285" fill="none" stroke="#526b80" stroke-width="2" marker-end="url(#arrow)"/><text x="661" y="252" font-family="sans-serif" font-size="13" fill="#516271">错误</text><polyline points="450,350 450,405" fill="none" stroke="#526b80" stroke-width="2" marker-end="url(#arrow)"/><text x="462" y="381" font-family="sans-serif" font-size="13" fill="#516271">preCheck</text><polyline points="335,444 200,444 200,525" fill="none" stroke="#526b80" stroke-width="2" marker-end="url(#arrow)"/><text x="212" y="489" font-family="sans-serif" font-size="13" fill="#516271">普通</text><polyline points="565,444 700,444 700,525" fill="none" stroke="#526b80" stroke-width="2" marker-end="url(#arrow)"/><text x="712" y="489" font-family="sans-serif" font-size="13" fill="#516271">CGI</text><polyline points="200,590 200,675 300,675" fill="none" stroke="#526b80" stroke-width="2" marker-end="url(#arrow)"/><text x="207" y="628" font-family="sans-serif" font-size="13" fill="#516271">序列化</text><polyline points="700,590 700,675 600,675" fill="none" stroke="#526b80" stroke-width="2" marker-end="url(#arrow)"/><text x="712" y="628" font-family="sans-serif" font-size="13" fill="#516271">finishCgi</text><polyline points="755,350 900,350 900,705 600,705" fill="none" stroke="#526b80" stroke-width="2" marker-end="url(#arrow)"/><text x="791" y="382" font-family="sans-serif" font-size="13" fill="#516271">排队错误</text><polyline points="335,425 290,425 290,650" fill="none" stroke="#526b80" stroke-width="2" marker-end="url(#arrow)"/><text x="86" y="414" font-family="sans-serif" font-size="13" fill="#516271">已处理 → 响应</text><polyline points="390,720 220,785" fill="none" stroke="#526b80" stroke-width="2" marker-end="url(#arrow)"/><text x="254" y="756" font-family="sans-serif" font-size="13" fill="#516271">保留连接</text><polyline points="520,720 700,785" fill="none" stroke="#526b80" stroke-width="2" marker-end="url(#arrow)"/><text x="596" y="756" font-family="sans-serif" font-size="13" fill="#516271">关闭连接</text><rect x="300" y="65" width="300" height="62" rx="10" fill="white" stroke="#94b1bd"/><text x="450.0" y="90" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#173f53">poll → handleRead → recv</text><text x="450.0" y="111" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#173f53">追加 Client.readBuffer</text><rect x="300" y="170" width="300" height="65" rx="10" fill="white" stroke="#94b1bd"/><text x="450.0" y="195" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#173f53">parseClientRequest</text><text x="450.0" y="216" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#173f53">请求行 → location → 上限 → 后续解析</text><rect x="25" y="285" width="240" height="65" rx="10" fill="white" stroke="#94b1bd"/><text x="145.0" y="310" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#173f53">INCOMPLETE</text><text x="145.0" y="331" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#173f53">保留状态，等待下一次 POLLIN</text><rect x="335" y="285" width="230" height="65" rx="10" fill="white" stroke="#94b1bd"/><text x="450.0" y="310" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#173f53">COMPLETE</text><text x="450.0" y="331" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#173f53">消费当前请求字节，保留后续请求</text><rect x="635" y="285" width="240" height="65" rx="10" fill="white" stroke="#94b1bd"/><text x="755.0" y="310" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#173f53">ERROR</text><text x="755.0" y="331" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#173f53">错误响应，Connection: close</text><rect x="335" y="405" width="230" height="62" rx="10" fill="white" stroke="#94b1bd"/><text x="450.0" y="430" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#173f53">preCheck</text><text x="450.0" y="451" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#173f53">路径 / 方法 / 重定向</text><rect x="80" y="525" width="240" height="65" rx="10" fill="white" stroke="#94b1bd"/><text x="200.0" y="550" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#173f53">handleResolved</text><text x="200.0" y="571" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#173f53">GET / POST / DELETE</text><rect x="580" y="525" width="240" height="65" rx="10" fill="white" stroke="#94b1bd"/><text x="700.0" y="550" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#173f53">tryStartCgi</text><text x="700.0" y="571" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#173f53">等待管道与子进程完成</text><rect x="300" y="650" width="300" height="70" rx="10" fill="white" stroke="#94b1bd"/><text x="450.0" y="675" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#173f53">writeBuffer → handleWrite → send</text><text x="450.0" y="696" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#173f53">未发完：保留偏移等 POLLOUT</text><rect x="80" y="785" width="280" height="65" rx="10" fill="white" stroke="#94b1bd"/><text x="220.0" y="810" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#173f53">keep-alive</text><text x="220.0" y="831" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#173f53">reset → 缓冲内下一请求 / POLLIN</text><rect x="580" y="785" width="240" height="65" rx="10" fill="white" stroke="#94b1bd"/><text x="700.0" y="810" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#173f53">close</text><text x="700.0" y="831" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#173f53">removeClient</text></svg>