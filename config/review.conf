server {
    listen 127.0.0.1:8080;

    root ./docs/review;
    index index.html;
    client_max_body_size 1000000000;

    error_page 400 ./www/errors/400.html;
    error_page 403 ./www/errors/403.html;
    error_page 404 ./www/errors/404.html;
    error_page 405 ./www/errors/405.html;
    error_page 413 ./www/errors/413.html;
    error_page 500 ./www/errors/500.html;
    error_page 501 ./www/errors/501.html;
    error_page 505 ./www/errors/505.html;

    location / {
        methods GET;
    }

    # Read-only source routes used by links in docs/review/*.html.
    location /src/ {
        root ./src;
        methods GET;
    }

    location /include/ {
        root ./include;
        methods GET;
    }

    location /cgi-bin/ {
        root ./cgi-bin;
        methods GET;
    }

    location /my_testers/ {
        root ./my_testers;
        methods GET;
    }
}
