server {
    listen 127.0.0.1:8080;
    listen 127.0.0.1:8081;

    root ./www;
    index index.html;
    client_max_body_size 1000000000;

    error_page 400 ./www/errors/400.html;
    error_page 403 ./www/errors/403.html;
    error_page 404 ./www/errors/404.html;
    error_page 405 ./www/errors/405.html;
    error_page 413 ./www/errors/413.html;
    error_page 500 ./www/errors/500.html;
    error_page 501 ./www/errors/501.html;
    error_page 505 ./www/errors/505.html;

    location / {
        methods GET;
    }

    location /directory/ {
        root ./YoupiBanane;
        index youpi.bad_extension;
        methods GET POST;
        cgi .bla ../cgi_tester;
    }

    location /post_body {
        root ./www/post_body;
        methods POST;
        client_max_body_size 100;
    }

    location /images {
        root ./assets;
        index gallery.html;
        methods GET;

        autoindex on;
    }

    location /upload {
        methods POST;

        upload_store ./uploads;
    }

    location /uploads {
        root ./uploads;

        methods GET;
    }

    location /delete {
        root ./www/delete;
        methods DELETE;
    }

    location /old {
        return 301 /new;
    }

    location /cgi-bin {
        root ./cgi-bin;

        methods GET POST;

        cgi .py /usr/bin/python3;
    }
}

server {
    listen 127.0.0.2:8080;
    root ./www1;
    client_max_body_size 5;
}

server {
    listen 127.0.0.3:8081;
    root ./www2;
    client_max_body_size 100;
}