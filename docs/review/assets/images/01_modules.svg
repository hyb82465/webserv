" height="70" rx="10" fill="white" stroke="#94b1bd"/><text x="145.0" y="370" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#173f53">RequestParser</text><text x="145.0" y="391" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#173f53">读 RequestState，推进解析</text><rect x="350" y="345" width="230" height="70" rx="10" fill="white" stroke="#94b1bd"/><text x="465.0" y="370" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#173f53">RequestHandler</text><text x="465.0" y="391" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#173f53">路由 · 文件 · 上传 · 删除</text><rect x="665" y="345" width="240" height="70" rx="10" fill="white" stroke="#94b1bd"/><text x="785.0" y="370" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#173f53">CgiHandler</text><text x="785.0" y="391" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#173f53">子进程 · stdin / stdout</text><rect x="350" y="495" width="230" height="70" rx="10" fill="white" stroke="#94b1bd"/><text x="465.0" y="520" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#173f53">HTTP 响应字节</text><text x="465.0" y="541" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#173f53">普通 HttpResponse / CGI 组装</text><rect x="665" y="495" width="240" height="70" rx="10" fill="white" stroke="#94b1bd"/><text x="785.0" y="520" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#173f53">Client.writeBuffer → send</text><text x="785.0" y="541" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#173f53">两条响应路径在这里汇合</text></svg>